name: iOS App Store Release (App Store Connect API Key)

on:
  workflow_dispatch:   # manual trigger from GitHub UI, so you control when it burns minutes and ships to App Store Connect

jobs:
  release-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Import Apple Distribution certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')

          rm certificate.p12
          echo "Imported identity:"
          security find-identity -v -p codesigning build.keychain

      - name: Import Apple Development certificate
        env:
          APPLE_DEV_CERTIFICATE_P12: ${{ secrets.APPLE_DEV_CERTIFICATE_P12 }}
          APPLE_DEV_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEV_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_DEV_CERTIFICATE_P12" | base64 --decode > dev_certificate.p12

          security import dev_certificate.p12 -k build.keychain -P "$APPLE_DEV_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          rm dev_certificate.p12
          echo "Imported identities:"
          security find-identity -v -p codesigning build.keychain

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Flutter pub get
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS app (unsigned archive)
        run: flutter build ios --release --no-codesign

      - name: Write App Store Connect API key to disk
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Archive and sign with automatic provisioning
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/Runner.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            clean archive

      - name: Export IPA (App Store distribution)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd ios
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $PWD/build/Runner.xcarchive \
            -exportPath $PWD/build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Force re-sign app and embedded frameworks with distribution identity
        run: |
          cd ios/build/ipa
          IPA=$(ls *.ipa | head -n1)
          rm -rf resign_tmp
          mkdir resign_tmp
          unzip -q "$IPA" -d resign_tmp
          APP_PATH="resign_tmp/Payload/Runner.app"

          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Apple Distribution" | head -n1 | sed -E 's/.*"(.*)"/\1/')
          echo "Re-signing with identity: $IDENTITY"

          # Preserve the entitlements exportArchive already embedded (push notifications, etc.)
          codesign -d --entitlements :- --xml "$APP_PATH" > entitlements.plist 2>/dev/null || true

          # Sign nested frameworks first (inside-out), then the app itself.
          if [ -d "$APP_PATH/Frameworks" ]; then
            find "$APP_PATH/Frameworks" -maxdepth 1 -name "*.framework" -print0 | \
              xargs -0 -I{} codesign --force --sign "$IDENTITY" "{}"
          fi

          if [ -s entitlements.plist ]; then
            codesign --force --sign "$IDENTITY" --entitlements entitlements.plist "$APP_PATH"
          else
            codesign --force --sign "$IDENTITY" "$APP_PATH"
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          rm -f "$IPA"
          (cd resign_tmp && zip -qr "../$IPA" Payload)
          rm -rf resign_tmp entitlements.plist

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-store-release-ipa
          path: ios/build/ipa/*.ipa

      - name: Upload to App Store Connect (TestFlight)
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd ios
          IPA_PATH=$(ls build/ipa/*.ipa | head -n1)
          xcrun altool --upload-app \
            --type ios \
            -f "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"